name: Release

# A pushed tag vX.Y.Z or vX.Y.Z-rc.N builds and publishes a GitHub release
# (see docs/RELEASING.md).
on:
  push:
    tags: ['v*']

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag format
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! $TAG =~ $re ]]; then
            echo "::error::$TAG is not a release tag such as v0.1.0 or v0.2.0-rc.1"
            exit 1
          fi
          if [[ $TAG == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: CHANGELOG.md has notes for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-notes.sh "$TAG"

  checks:
    name: Checks
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: [tag, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build provenance attestation: a Sigstore certificate (id-token) and
      # storing the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency caches in the release build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read Go version from go.mod
        id: go-version
        run: echo "minor=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go-version.outputs.minor }}.x
          check-latest: true
          cache: false

      - name: Build the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release.sh "$TAG" dist/release
          bash scripts/release-notes.sh "$TAG" > dist/notes.md

      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/release/golem-deploy_linux_amd64.tar.gz
            dist/release/golem-deploy_linux_arm64.tar.gz
            dist/release/install.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist
          if-no-files-found: error

  publish:
    name: Publish
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      # sha256sum -c alone passes with missing entries: SHA256SUMS must hold
      # exactly one entry for each asset, nothing else, and match the files.
      # They are compared as files, because a command substitution drops NUL
      # bytes and trailing newlines.
      - name: SHA256SUMS matches the files to upload
        working-directory: dist/release
        run: |
          set -o pipefail
          tmp=$(mktemp -d)
          sha256sum golem-deploy_linux_amd64.tar.gz golem-deploy_linux_arm64.tar.gz install.sh |
            sed 's/^\([0-9a-f]\{64\}\) [ *]/\1  /' | LC_ALL=C sort >"$tmp/want"
          LC_ALL=C sort SHA256SUMS >"$tmp/got"
          if ! cmp -s "$tmp/want" "$tmp/got"; then
            echo "::error::SHA256SUMS does not list exactly the three assets with their digests"
            diff "$tmp/want" "$tmp/got" || true
            exit 1
          fi
          cat SHA256SUMS

      # The tag must still name the commit this run built and attested.
      - name: The tag still points at the built commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          refs=$(git ls-remote "$REPO_URL" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          # An annotated tag lists the tag object and then the commit (^{}).
          commit=$(printf '%s\n' "$refs" | awk -v t="refs/tags/$TAG^{}" '$2 == t { print $1 }')
          if [ -z "$commit" ]; then
            commit=$(printf '%s\n' "$refs" | awk -v t="refs/tags/$TAG" '$2 == t { print $1 }')
          fi
          if [ "$commit" != "$SHA" ]; then
            echo "::error::tag $TAG points at ${commit:-nothing} on the remote, but this run built $SHA"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file dist/notes.md "${flags[@]}" \
            dist/release/golem-deploy_linux_amd64.tar.gz \
            dist/release/golem-deploy_linux_arm64.tar.gz \
            dist/release/install.sh \
            dist/release/SHA256SUMS
