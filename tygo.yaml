# Generates the web client's API types from the Go wire types.
# Run scripts/gen-types.sh; CI fails when the output is stale.
packages:
  - path: "github.com/demiurgos-hub/golem-deploy/internal/apitypes"
    output_path: "frontend/src/api/types.gen.ts"
    indent: "  "
    enum_style: "union"
    type_mappings:
      time.Time: "string /* RFC 3339, UTC */"
    frontmatter: |
      // Source: internal/apitypes. Regenerate with scripts/gen-types.sh.
